<router-outlet></router-outlet>

<button
  type="button"
  (click)="toggleAssistant()"
  class="fixed bottom-5 right-5 z-[70] rounded-full bg-cyan-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-cyan-900/40 hover:bg-cyan-500"
>
  Asistente IA
</button>

@if (assistantOpen()) {
  <div class="fixed inset-0 z-[80] bg-black/50" (click)="closeAssistant()"></div>

  <section class="fixed right-4 top-4 bottom-4 z-[90] w-[min(96vw,430px)] rounded-xl border border-slate-700 bg-[#0b1b2d] text-gray-200 shadow-2xl shadow-black/40 flex flex-col overflow-hidden">
    <header class="flex items-center justify-between border-b border-slate-700 px-4 py-3">
      <div>
        <h2 class="text-base font-semibold text-white">Asistente y reservas</h2>
        <p class="text-xs text-slate-400">Chat IA + Calendly</p>
      </div>
      <button type="button" (click)="closeAssistant()" class="rounded-md border border-slate-600 px-2 py-1 text-xs hover:bg-slate-800">
        Cerrar
      </button>
    </header>

    <div class="p-4 border-b border-slate-700">
      <button
        type="button"
        (click)="openBooking()"
        class="rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white hover:bg-blue-500"
      >
        Reservar cita
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-3 space-y-2">
      @if (chat.messages().length === 0) {
        <p class="text-sm text-slate-400">Escribe tu pregunta y el asistente te responderá.</p>
      }
      @for (msg of chat.messages(); track $index) {
        <div
          class="max-w-[85%] rounded-lg px-3 py-2 text-sm"
          [class.ml-auto]="msg.role === 'user'"
          [class.bg-cyan-600]="msg.role === 'user'"
          [class.text-white]="msg.role === 'user'"
          [class.bg-slate-800]="msg.role === 'assistant'"
        >
          {{ msg.content }}
        </div>
      }
      @if (chat.loading()) {
        <div class="max-w-[85%] rounded-lg bg-slate-800 px-3 py-2 text-sm text-slate-400">Escribiendo…</div>
      }
    </div>

    <form (ngSubmit)="sendMessage()" class="flex gap-2 border-t border-slate-700 p-3">
      <input
        type="text"
        name="draft"
        [(ngModel)]="draft"
        placeholder="Escribe un mensaje…"
        class="flex-1 rounded-md border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-white placeholder:text-slate-500 focus:border-cyan-500 focus:outline-none"
      />
      <button
        type="submit"
        [disabled]="chat.loading()"
        class="rounded-md bg-cyan-600 px-3 py-2 text-sm font-semibold text-white hover:bg-cyan-500 disabled:opacity-50"
      >
        Enviar
      </button>
    </form>
  </section>
}
